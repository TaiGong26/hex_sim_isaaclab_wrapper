[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex_sim_isaaclab_wrapper"
version = "0.1.0"
description = "HEXFELLOW Robot Simulator Wrapper — Isaac Lab backend (Archer Y6 V1)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{ name = "Dong Zhaorui", email = "dzr159@gmail.com" }]
keywords = ["hex", "sim", "isaac-lab", "robot"]
requires-python = ">=3.10"
dependencies = [
  "hex_util_msg>=0.1.0a4,<0.2.0",
  "hex_util_runtime>=0.0.0,<0.1.0",
  "numpy>=1.0",
  "torch>=2.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
isaaclab = [
  "hex_isaac_usd>=0.0.0,<0.1.0",
]